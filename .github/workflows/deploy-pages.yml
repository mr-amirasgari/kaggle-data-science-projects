name: Deploy Data Science Dashboards to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Drug dashboard dependencies
        working-directory: drug-classification
        run: npm install

      - name: Test Drug dashboard
        working-directory: drug-classification
        run: npm test

      - name: Build Drug dashboard
        working-directory: drug-classification
        run: npm run build

      - name: Install Loan dashboard dependencies
        working-directory: loan-credit-analysis
        run: npm install

      - name: Test Loan dashboard
        working-directory: loan-credit-analysis
        run: npm test

      - name: Build Loan dashboard
        working-directory: loan-credit-analysis
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site/loan-credit-analysis
          cp -R drug-classification/dist/. site/
          cp -R loan-credit-analysis/dist/. site/loan-credit-analysis/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
