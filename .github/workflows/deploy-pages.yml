name: Deploy Portfolio Dashboards to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            drug-classification/package-lock.json
            loan-credit-analysis/package-lock.json
            retail-store-sales-analysis/package-lock.json
            diabetes-hospital-readmission-analysis/dashboard/package-lock.json

      - name: Build Drug dashboard
        working-directory: drug-classification
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Loan dashboard
        working-directory: loan-credit-analysis
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Retail dashboard
        working-directory: retail-store-sales-analysis
        run: |
          npm install
          npm test
          npm run build

      - name: Build Diabetes dashboard
        working-directory: diabetes-hospital-readmission-analysis/dashboard
        run: |
          npm install
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p site/loan-credit-analysis
          mkdir -p site/retail-store-sales-analysis
          mkdir -p site/diabetes-hospital-readmission-analysis

          cp -r drug-classification/dist/. site/
          cp -r loan-credit-analysis/dist/. site/loan-credit-analysis/
          cp -r retail-store-sales-analysis/dist/. site/retail-store-sales-analysis/
          cp -r diabetes-hospital-readmission-analysis/dashboard/dist/. site/diabetes-hospital-readmission-analysis/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4